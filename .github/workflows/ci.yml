name: LeetCode Solutions CI & Auto-Update

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-update:
    name: Auto-Update README & Verify Solutions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Auto-Update README Tables & Metrics
        run: |
          python3 scripts/update_readme.py

      - name: Commit & Push Updated README (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md scripts/topics_cache.json; then
            echo "Changes detected. Committing..."
            git add README.md scripts/topics_cache.json
            git commit -m "🤖 Auto-update README problem index, topics & statistics [skip ci]" || true
            git pull --rebase origin main || true
            git push origin main || true
          else
            echo "README.md is already up-to-date."
          fi

      - name: Verify Solutions
        run: |
          python3 scripts/verify_solutions.py
